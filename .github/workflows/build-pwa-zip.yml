name: Build PWA ZIP
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          mkdir -p dist
          zip -r dist/Sarasvati_School_Paper_Maker_PWA_v2026.09.23.4.zip . -x ".git/*" ".github/*" "dist/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sarasvati_School_Paper_Maker_PWA_v2026.09.23.4
          path: dist/Sarasvati_School_Paper_Maker_PWA_v2026.09.23.4.zip
