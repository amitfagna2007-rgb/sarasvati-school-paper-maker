name: Build downloadable PWA ZIP

on:
  push:
    branches: ["main"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          zip -r Sarasvati_School_Paper_Maker_PWA_Latest.zip . -x ".git/*" ".github/workflows/package.yml"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sarasvati_School_Paper_Maker_PWA_Latest
          path: Sarasvati_School_Paper_Maker_PWA_Latest.zip
