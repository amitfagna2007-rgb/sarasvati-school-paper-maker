<header class="noprint" style="background:#173f67;color:#fff;padding:12px"><div class="wrap"><h1>📚 Sarasvati School Paper Maker</h1></div></header><main class="wrap">
<section class="card noprint"><h2>Paper Details</h2><div class="grid"><label>School Name<input id="school" value="SARASVATI BAL VIDHYA MANDIR SAKARGHATA"></label><label>Exam Name<input id="exam" value="Unit Test"></label><label>Class<input id="cls" placeholder="Class 10"></label><label>Subject<input id="subject" placeholder="Science"></label><label>Date<input id="date" type="date"></label><label>Time<input id="time" value="2 Hours"></label><label>Total Marks<input id="total" type="number" value="50"></label><label>Watermark<input id="wm" value="SARASVATI SCHOOL"></label></div></section>
<section class="card noprint"><h2>Questions</h2><div class="actions"><button class="primary" id="add">＋ Add Question</button><button id="saveBank">📚 Save Question to Bank</button><button id="openBank">📖 Question Bank</button><button id="hindiTip">हिंदी में लिखें</button><button type="button" id="voice" onclick="startVoiceQuestion()">🎤 Voice Question</button><select id="voiceLang" style="width:auto"><option value="hi-IN">हिंदी</option><option value="en-IN">English</option><option value="sa-IN">संस्कृत</option></select><button id="save">💾 Save Paper</button><button id="clear">🆕 New Paper</button><button id="backup">📦 Backup</button><button id="restoreBtn">📥 Restore</button><input id="restore" type="file" accept=".json" hidden><button id="install" class="primary" style="display:inline-block">📲 Install App</button><button id="updateApp">🔄 Update</button></div><div id="qs"></div></section>
<section class="card noprint" id="bankPanel" style="display:none"><h2>📚 Question Bank</h2><div class="grid"><label>Search Question<input id="bankSearch" placeholder="प्रश्न खोजें..."></label><label>Class/Subject Filter<input id="bankFilter" placeholder="जैसे: 10 / Science"></label></div><div id="bankList" style="margin-top:10px"></div><p style="font-size:12px;color:#666">Question Bank इसी device में offline save रहता है।</p></section>
<section class="card noprint"><h2>Saved Papers & Backup</h2><div id="savedList"></div><p style="font-size:12px;color:#666">Saved papers इसी device पर रहते हैं।</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script>
let activeVoice=null,voiceBase='',voiceTargetIndex=-1;
function startVoiceQuestion(){
  const btn=document.getElementById('voice');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('इस Chrome में Voice Recognition उपलब्ध नहीं है। Chrome को update करके Internet ON रखें।');return;}
  if(btn._recognition){try{btn._recognition.stop()}catch(e){}return;}
  let target=document.querySelector('.qt:focus')||[...document.querySelectorAll('.qt')].pop();
  if(!target){questions.push({text:'',type:'Short',marks:1,options:[]});render();target=[...document.querySelectorAll('.qt')].pop();}
  if(!target)return;
  const boxes=()=>[...document.querySelectorAll('.qt')],idx=boxes().indexOf(target);
  if(idx<0)return;
  const selectedLang=document.getElementById('voiceLang').value||'hi-IN';
  const beginRecognition=()=>{
    const r=new SR();btn._recognition=r;btn.textContent='🎙️ सुन रहा हूँ...';
    r.lang=selectedLang;r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
    setupRecognition(r);
  };
  const setupRecognition=(r)=>{
  const old=questions[idx]?.text||'';
  const reset=()=>{if(btn._recognition===r)btn._recognition=null;btn.textContent='🎤 Voice Question';};
  r.onstart=()=>{btn.textContent='🎙️ बोलिए...';};
  r.onaudiostart=()=>{btn.textContent='🎙️ आवाज़ सुन रहा हूँ...';};
  r.onresult=e=>{
    const t=(e.results?.[0]?.[0]?.transcript||'').trim();
    if(!t)return;
    questions[idx].text=(old?(old+' '):'')+t;
    const q=boxes()[idx];if(q){q.value=questions[idx].text;q.focus();q.setSelectionRange(q.value.length,q.value.length);}
    renderPreview();
  };
  r.onerror=e=>{
    const code=e.error||'unknown';reset();
    if(code==='language-not-supported' && selectedLang==='sa-IN')alert('इस Chrome में संस्कृत Voice Recognition समर्थित नहीं है। हिंदी/English Voice Recognition वैसे ही काम करेगा।');
    else if(code==='not-allowed'||code==='service-not-allowed')alert('Chrome में Microphone को Allow करें।');
    else if(code==='no-speech')alert('आवाज़ नहीं मिली। 🎤 दबाकर साफ बोलें।');
    else if(code==='network')alert('Voice Recognition के लिए Internet ON रखें।');
    else if(code==='audio-capture')alert('Chrome को microphone नहीं मिल रहा।');
    else alert('Voice Recognition error: '+code);
  };
  r.onend=()=>reset();
  try{r.start();}catch(e){reset();alert('Voice शुरू नहीं हुआ। Chrome page को refresh करके फिर कोशिश करें।');}
  };
  if(selectedLang==='sa-IN'){
    // Sanskrit must never silently fall back to an English/cloud recognizer.
    // Use Chrome's on-device recognition only when the browser actually has a
    // Sanskrit language pack. If it can be downloaded, install it first.
    rlangSetup();
  }else{
    beginRecognition();
  }
  function rlangSetup(){
    const available=SR.available;
    const install=SR.install;
    if(typeof available!=='function'){
      alert('इस Chrome में on-device Sanskrit speech support उपलब्ध नहीं है। इसलिए Sanskrit को English में बदलने से बचाने के लिए Voice शुरू नहीं किया गया।');
      return;
    }
    Promise.resolve(available({langs:['sa-IN'],processLocally:true})).then(async status=>{
      if(status==='available'){
        const r=new SR();
        r.processLocally=true;
        btn._recognition=r;
        btn.textContent='🎙️ सुन रहा हूँ...';
        r.lang='sa-IN';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
        setupRecognition(r);
      }else if((status==='downloadable'||status==='downloading') && typeof install==='function'){
        btn.textContent='⏳ Sanskrit language pack...';
        let ok=false;
        try{ok=await install({langs:['sa-IN'],processLocally:true});}catch(e){}
        if(ok){
          alert('Sanskrit speech pack तैयार हो गया। अब Voice Question दबाकर फिर Sanskrit में बोलें।');
        }else{
          alert('इस Chrome में Sanskrit speech pack उपलब्ध नहीं है। English fallback बंद रखा गया है।');
        }
        btn.textContent='🎤 Voice Question';
      }else{
        alert('इस Chrome में Sanskrit speech recognition उपलब्ध नहीं है। English fallback बंद रखा गया है।');
      }
    }).catch(()=>{
      alert('इस Chrome में Sanskrit speech recognition उपलब्ध नहीं है। English fallback बंद रखा गया है।');
    });
  }
}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let questions=[],saved=JSON.parse(localStorage.getItem('spm_saved')||'[]'),questionBank=JSON.parse(localStorage.getItem('spm_question_bank')||'[]');function val(id){return $(id).value}function state(){return{school:val('school'),exam:val('exam'),cls:val('cls'),subject:val('subject'),date:val('date'),time:val('time'),total:val('total'),wm:val('wm'),questions}}
function renderQuestions(){const root=$('qs');root.innerHTML='';questions.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<div><b>Q'+(i+1)+'.</b><textarea class="qt" dir="auto" placeholder="प्रश्न हिंदी या English में लिखें...">'+esc(q.text)+'</textarea></div><div class="grid"><label>Type<select class="type"><option '+(q.type==='Short'?'selected':'')+'>Short</option><option '+(q.type==='MCQ'?'selected':'')+'>MCQ</option><option '+(q.type==='Fill'?'selected':'')+'>Fill</option><option '+(q.type==='Long'?'selected':'')+'>Long</option></select></label><label>Marks<input class="mk" type="number" value="'+(q.marks||1)+'"></label></div>'+(q.type==='MCQ'?'<div class="opts"><b>MCQ Options</b><div class="grid">'+[0,1,2,3].map(j=>'<label>('+String.fromCharCode(65+j)+')<input class="op" data-i="'+j+'" value="'+esc((q.options||[])[j]||'')+'"></label>').join('')+'</div></div>':'')+'<div class="actions" style="margin-top:8px"><label style="display:inline-block">🖼️ Question Image<input class="img" type="file" accept="image/*"></label><button type="button" class="removeImg" style="display:none">Remove Image</button></div><div class="imgPreview" style="text-align:center"></div><div class="actions" style="margin-top:8px"><button class="up">↑</button><button class="down">↓</button><button class="dup">Duplicate</button><button class="saveQBank">📚 Bank</button><button class="del danger">Delete</button></div>';
d.querySelector('.qt').oninput=e=>{q.text=e.target.value;renderPreview()};d.querySelector('.mk').oninput=e=>{q.marks=Number(e.target.value)||0;renderPreview()};d.querySelector('.type').onchange=e=>{q.type=e.target.value;q.options=q.options||[];renderQuestions();renderPreview()};d.querySelectorAll('.op').forEach(x=>x.oninput=e=>{q.options=q.options||[];q.options[Number(e.target.dataset.i)]=e.target.value;renderPreview()});d.querySelector('.img').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('कृपया image file चुनें।');let r=new FileReader();r.onload=ev=>{let im=new Image();im.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.max(1,Math.round(im.naturalWidth*scale)),h=Math.max(1,Math.round(im.naturalHeight*scale));const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);q.image=cv.toDataURL('image/jpeg',.82);renderQuestions();renderPreview()};im.src=ev.target.result};r.readAsDataURL(f)};if(q.image){d.querySelector('.imgPreview').innerHTML='<img src="'+q.image+'" style="max-width:100%;max-height:220px;border:1px solid #ddd;border-radius:6px;margin-top:7px">';let b=d.querySelector('.removeImg');b.style.display='inline-block';b.onclick=()=>{q.image='';renderQuestions();renderPreview()}}d.querySelector('.del').onclick=()=>{questions.splice(i,1);render()};d.querySelector('.up').onclick=()=>{if(i){[questions[i-1],questions[i]]=[questions[i],questions[i-1]];render()}};d.querySelector('.down').onclick=()=>{if(i<questions.length-1){[questions[i],questions[i+1]]=[questions[i+1],questions[i]];render()}};d.querySelector('.dup').onclick=()=>{questions.splice(i+1,0,JSON.parse(JSON.stringify(q)));render()};d.querySelector('.saveQBank').onclick=()=>saveQuestionBank(q);root.appendChild(d)})}
function onePaper(label='Page 1'){let s=state(),h='<div class="paper"><div class="page-label">'+label+'</div><div class="wm">'+esc(s.wm)+'</div><div class="head"><div class="brandline"><img class="logo" src="school_logo.svg" alt="School Logo"><div><div class="school">'+esc(s.school)+'</div><div>'+esc(s.exam)+' — Question Paper</div></div></div></div><div class="meta"><span>Class: <b>'+esc(s.cls)+'</b></span><span>Subject: <b>'+esc(s.subject)+'</b></span><span>Time: <b>'+esc(s.time)+'</b></span><span>Max Marks: <b>'+esc(s.total)+'</b></span></div><div class="meta"><span>Name: __________________</span><span>Roll No.: ______</span><span>Date: '+esc(s.date)+'</span></div><div class="question-area">';let last='';s.questions.forEach((q,i)=>{let sec=q.type==='MCQ'?'Section A — MCQ':q.type==='Fill'?'Section B — Fill in the Blanks':q.type==='Short'?'Section C — Short Answer':'Section D — Long Answer';if(sec!==last){h+='<div class="section">'+sec+'</div>';last=sec}h+='<div class="pq"><b>Q'+(i+1)+'.</b> '+esc(q.text)+' <span style="float:right">['+(q.marks||1)+']</span>'+(q.image?'<img src="'+q.image+'" alt="Question image">':'');if(q.type==='MCQ')h+='<div>'+((q.options||[]).map((x,j)=>'('+String.fromCharCode(97+j)+') '+esc(x)).join(' &nbsp; '))+'</div>';h+='</div>'});return h+'</div></div>'}
function fitQuestionText(){const layout=val('layout');const minH=layout==='four'?74.25:layout==='half'?297:297;document.querySelectorAll('#preview .paper').forEach(p=>{p.style.minHeight=minH+'mm';const area=p.querySelector('.question-area');if(!area)return;let size=Math.max(9,parseFloat(getComputedStyle(p).fontSize)||10);area.style.fontSize=size+'px';area.style.lineHeight='1.28';const limit=Math.max(40,p.clientHeight-area.offsetTop-6);let guard=0;while(size<72&&guard++<140){const before=area.scrollHeight;area.style.fontSize=(size+0.5)+'px';if(area.scrollHeight>limit){area.style.fontSize=size+'px';break}size+=0.5}area.style.marginBottom='0';});}
function renderPreview(){let layout=val('layout');if(layout==='four')$('preview').innerHTML='<div class="sheet4">'+onePaper('Page 1/4')+onePaper('Page 1/4')+onePaper('Page 1/4')+onePaper('Page 1/4')+'</div>';else if(layout==='half')$('preview').innerHTML='<div class="sheet2">'+onePaper('Page 1/2')+onePaper('Page 1/2')+'</div>';else $('preview').innerHTML=onePaper('Page 1');requestAnimationFrame(()=>fitQuestionText())}
function saveQuestionBank(q){if(!q||!String(q.text||'').trim())return alert('पहले question लिखें।');const item=JSON.parse(JSON.stringify(q));item.id=Date.now()+'_'+Math.random().toString(36).slice(2,8);item.cls=val('cls');item.subject=val('subject');item.savedAt=new Date().toISOString();questionBank.unshift(item);localStorage.setItem('spm_question_bank',JSON.stringify(questionBank));renderBank();alert('Question Bank में save हो गया।')}
function renderBank(){const r=$('bankList');if(!r)return;const term=(val('bankSearch')||'').toLowerCase().trim(),filter=(val('bankFilter')||'').toLowerCase().trim();const list=questionBank.filter(q=>(!term||String(q.text||'').toLowerCase().includes(term))&&(!filter||(String(q.cls||'')+' '+String(q.subject||'')+' '+String(q.type||'')).toLowerCase().includes(filter)));r.innerHTML=list.length?list.map(q=>'<div style="border:1px solid #ddd;border-radius:9px;padding:9px;margin:7px 0"><b>'+esc(q.text||'(खाली)')+'</b><div style="font-size:12px;color:#666;margin-top:4px">'+esc(q.cls||'')+' • '+esc(q.subject||'')+' • '+esc(q.type||'Short')+' • '+(q.marks||1)+' marks</div><div class="actions" style="margin-top:6px"><button onclick="addFromBank(\''+q.id+'\')">➕ Paper में जोड़ें</button><button class="danger" onclick="deleteFromBank(\''+q.id+'\')">Delete</button></div></div>').join(''):'<p style="font-size:13px;color:#666">Question Bank अभी खाली है।</p>'}
window.addFromBank=id=>{const q=questionBank.find(x=>x.id===id);if(!q)return;const copy=JSON.parse(JSON.stringify(q));delete copy.id;delete copy.cls;delete copy.subject;delete copy.savedAt;questions.push(copy);render()};window.deleteFromBank=id=>{if(!confirm('इस question को Question Bank से हटाएँ?'))return;questionBank=questionBank.filter(x=>x.id!==id);localStorage.setItem('spm_question_bank',JSON.stringify(questionBank));renderBank()};
function renderSaved(){const r=$('savedList');if(!r)return;r.innerHTML=saved.length?saved.map((x,i)=>'<div style="border-top:1px solid #ddd;padding:8px 0"><b>'+esc(x.name)+'</b> <small>'+new Date(x.when).toLocaleString()+'</small><div class="actions" style="margin-top:5px"><button onclick="loadSaved('+i+')">Open</button><button class="danger" onclick="deleteSaved('+i+')">Delete</button></div></div>').join(''):'<p style="font-size:13px;color:#666">अभी कोई saved paper नहीं है।</p>'}window.loadSaved=i=>{let s=saved[i]?.data;if(!s)return;Object.keys(s).filter(k=>k!=='questions').forEach(k=>{if($(k))$(k).value=s[k]});questions=s.questions||[];render()};window.deleteSaved=i=>{saved.splice(i,1);localStorage.setItem('spm_saved',JSON.stringify(saved));renderSaved()};function render(){renderQuestions();renderPreview();renderSaved();renderBank()}

.questions)?s.questions:[]}render();alert('Backup restore हो गया।')}catch{alert('Backup गलत या अधूरा है। पुराना data सुरक्षित रखा गया है।')}};r.readAsText(f)};

$('previewPdf').onclick=async()=>{const btn=$('previewPdf'),old=btn.textContent;btn.disabled=true;btn.textContent='⏳ PDF बन रहा है...';let blobUrl='';try{if(typeof html2pdf!=='function'){document.title=(val('school')||'School')+' - '+(val('subject')||'Question Paper');window.print();return;}const el=$('preview');if(!el||!el.innerHTML.trim())throw new Error('preview is empty');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const images=[...el.querySelectorAll('img')];await Promise.all(images.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r})));fitQuestionText();await new Promise(r=>requestAnimationFrame(r));const name=((val('school')||'School')+' - '+(val('subject')||'Question Paper')).replace(/[\\/:*?"<>|]/g,'_');const four=val('layout')==='four';const half=val('layout')==='half';if(half){const s2=el.querySelector('.sheet2');if(!s2)throw new Error('half layout missing');s2.style.width='210mm';s2.style.height='297mm';s2.style.gridTemplateColumns='105mm 105mm';s2.style.gridTemplateRows='297mm';[...s2.querySelectorAll('.paper')].forEach(p=>{p.style.width='105mm';p.style.height='297mm';p.style.minHeight='297mm';p.style.maxHeight='297mm';p.style.overflow='hidden';});}const opt={margin:0,filename:name+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#fff',scrollX:0,scrollY:0,windowWidth:Math.max(794,el.scrollWidth||document.documentElement.scrollWidth)},jsPDF:{unit:'mm',format:(val('paperSize')||'A4').toLowerCase(),orientation:(four||half)?'portrait':(val('orientation')||'portrait')},pagebreak:{mode:['css'],before:[],after:[],avoid:['.pq']}};const pdf=await html2pdf().set(opt).from(el).toPdf().get('pdf');const blob=pdf.output('blob');if(!blob||blob.size<1024)throw new Error('empty PDF blob');blobUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=blobUrl;a.download=name+'.pdf';a.rel='noopener';document.body.appendChild(a);a.click();a.remo ['school','exam','cls','subject','date','time','total','wm'].forEach(id=>$(id).oninput=renderPreview);let promptEvent=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').style.display='inline-block'});$('install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;return}alert('Chrome ने अभी install prompt उपलब्ध नहीं किया है। Chrome के ⋮ मेन्यू में Add to Home screen चुनें। अगर यह विकल्प भी नहीं है, तो Chrome में इसी HTTPS लिंक को सीधे खोलकर एक बार refresh करें।')};let swReg=null;let refreshing=false;
const doAppUpdate=async()=>{
  const b=$('updateApp');
  const old=b.textContent;
  b.disabled=true;b.textContent='⏳ Checking...';
  try{
    let reg=swReg;
    if(!reg&&'serviceWorker'in navigator) reg=await navigator.serviceWorker.getRegistration();
    if(!reg&&'serviceWorker'in navigator) reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
    swReg=reg;
    if(reg){
      await reg.update();
      const waitForInstall=()=>{
        if(!reg.installing)return false;
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            refreshing=true;location.reload();
          }
        });
        return true;
      };
      if(!waitForInstall()){
        setTimeout(()=>{if(!refreshing){b.disabled=false;b.textContent='🔄 Update';alert('Update check पूरा हुआ। अगर नया version उपलब्ध है तो app refresh होगा।')}},1200);
      }
    }else{
      b.disabled=false;b.textContent=old;alert('Update के लिए Chrome में Internet ON करें।');
    }
  }catch(e){
    b.disabled=false;b.textContent=old;alert('Update नहीं हो पाया। Internet ON करके फिर 🔄 Update दबाएँ।');
  }
};
$('updateApp').onclick=doAppUpdate;
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{

      const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          refreshing=true;location.reload();
        }
      });
    });
  }).catch(()=>{});
}
