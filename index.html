<header class="noprint" style="background:#173f67;color:#fff;padding:12px"><div class="wrap"><h1>📚 Sarasvati School Paper Maker</h1></div></header><main class="wrap">
<section class="card noprint"><h2>Paper Details</h2><div class="grid"><label>School Name<input id="school" value="SARASVATI BAL VIDHYA MANDIR SAKARGHATA"></label><label>Exam Name<input id="exam" value="Unit Test"></label><label>Class<input id="cls" placeholder="Class 10"></label><label>Subject<input id="subject" placeholder="Science"></label><label>Date<input id="date" type="date"></label><label>Time<input id="time" value="2 Hours"></label><label>Total Marks<input id="total" type="number" value="50"></label><label>Watermark<input id="wm" value="SARASVATI SCHOOL"></label></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let questions=[],saved=JSON.parse(localStorage.getItem('spm_saved')||'[]'),questionBank=JSON.parse(localStorage.getItem('spm_question_bank')||'[]');function val(id){return $(id).value}function state(){return{school:val('school'),exam:val('exam'),cls:val('cls'),subject:val('subject'),date:val('date'),time:val('time'),total:val('total'),wm:val('wm'),questions}}

d.querySelector('.qt').oninput=e=>{q.text=e.target.value;renderPreview()};d.querySelector('.mk').oninput=e=>{q.marks=Number(e.target.value)||0;renderPreview()};d.querySelector('.type').onchange=e=>{q.type=e.target.value;q.options=q.options||[];renderQuestions();renderPreview()};d.querySelectorAll('.op').forEach(x=>x.oninput=e=>{q.options=q.options||[];q.options[Number(e.target.dataset.i)]=e.target.value;renderPreview()});d.querySelector('.img').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('कृपया image file चुनें।');let r=new FileReader();r.onload=ev=>{let im=new Image();im.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.max(1,Math.round(im.naturalWidth*scale)),h=Math.max(1,Math.round(im.naturalHeight*scale));const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);q.image=cv.toDataURL('image/jpeg',.82);renderQuestions();renderPreview()};im.src=ev.target.result};r.readAsDataURL(f)};if(q.image){d.querySelector('.imgPreview').innerHTML='<img src="'+q.image+'" style="max-width:100%;max-height:220px;border:1px solid #ddd;border-radius:6px;margin-top:7px">';let b=d.querySelector('.removeImg');b.style.display='inline-block';b.onclick=()=>{q.image='';renderQuestions();renderPreview()}}d.querySelector('.del').onclick=()=>{questions.splice(i,1);render()};d.querySelector('.up').onclick=()=>{if(i){[questions[i-1],questions[i]]=[questions[i],questions[i-1]];render()}};d.querySelector('.down').onclick=()=>{if(i<questions.length-1){[questions[i],questions[i+1]]=[questions[i+1],questions[i]];render()}};d.querySelector('.dup').onclick=()=>{questions.splice(i+1,0,JSON.parse(JSON.stringify(q)));render()};d.querySelector('.saveQBank').onclick=()=>saveQuestionBank(q);root.appendChild(d)})}
function onePaper(label='Page 1'){let s=state(),h='<div class="paper"><div class="page-label">'+label+'</div><div class="wm">'+esc(s.wm)+'</div><div class="head"><div class="brandline"><img class="logo" src="school_logo.svg" alt="School Logo"><div><div class="school">'+esc(s.school)+'</div><div>'+esc(s.exam)+' — Question Paper</div></div></div></div><div class="meta"><span>Class: <b>'+esc(s.cls)+'</b></span><span>Subject: <b>'+esc(s.subject)+'</b></span><span>Time: <b>'+esc(s.time)+'</b></span><span>Max Marks: <b>'+esc(s.total)+'</b></span></div><div class="meta"><span>Name: __________________</span><span>Roll No.: ______</span><span>Date: '+esc(s.date)+'</span></div><div class="question-area">';let last='';s.questions.forEach((q,i)=>{let sec=q.type==='MCQ'?'Section A — MCQ':q.type==='Fill'?'Section B — Fill in the Blanks':q.type==='Long'?'Section C — Long Answer':'Section D — Short Answer';if(sec!==last){h+='<div class="section">'+sec+'</div>';last=sec}h+='<div class="pq"><b>Q'+(i+1)+'.</b> '+esc(q.text)+' <span style="float:right">['+(q.marks||1)+']</span>'+(q.image?'<img src="'+q.image+'" alt="Question image">':'');if(q.type==='MCQ')h+='<div>'+((q.options||[]).map((x,j)=>'('+String.fromCharCode(97+j)+') '+esc(x)).join(' &nbsp; '))+'</div>';h+='</div>'});return h+'</div></div>'}
function fitQuestionText(){const layout=val('layout');const minH=layout==='four'?74.25:layout==='half'?148.5:297;document.querySelectorAll('#preview .paper').forEach(p=>{p.style.minHeight=minH+'mm';const area=p.querySelector('.question-area');if(!area)return;let base=parseFloat(getComputedStyle(p).fontSize)||10;let size=base;area.style.fontSize=size+'px';area.style.lineHeight='1.28';const limit=Math.max(40,p.clientHeight-area.offsetTop-8);while(size<32){area.style.fontSize=(size+0.5)+'px';if(area.scrollHeight>limit){area.style.fontSize=size+'px';break}size+=0.5}});}
function renderPreview(){let layout=val('layout');if(layout==='four')$('preview').innerHTML='<div class="sheet4">'+onePaper('Page 1/4')+onePaper('Page 1/4')+onePaper('Page 1/4')+onePaper('Page 1/4')+'</div>';else if(layout==='half')$('preview').innerHTML='<div class="sheet2">'+onePaper('Page 1/2')+onePaper('Page 1/2')+'</div>';else $('preview').innerHTML=onePaper('Page 1');requestAnimationFrame(()=>fitQuestionText())}
function saveQuestionBank(q){if(!q||!String(q.text||'').trim())return alert('पहले question लिखें।');const item=JSON.parse(JSON.stringify(q));item.id=Date.now()+'_'+Math.random().toString(36).slice(2,8);item.cls=val('cls');item.subject=val('subject');item.savedAt=new Date().toISOString();questionBank.unshift(item);localStorage.setItem('spm_question_bank',JSON.stringify(questionBank));renderBank();alert('Question Bank में save हो गया।')}
function renderBank(){const r=$('bankList');if(!r)return;const term=(val('bankSearch')||'').toLowerCase().trim(),filter=(val('bankFilter')||'').toLowerCase().trim();const list=questionBank.filter(q=>(!term||String(q.text||'').toLowerCase().includes(term))&&(!filter||(String(q.cls||'')+' '+String(q.subject||'')+' '+String(q.type||'')).toLowerCase().includes(filter)));r.innerHTML=list.length?list.map(q=>'<div style="border:1px solid #ddd;border-radius:9px;padding:9px;margin:7px 0"><b>'+esc(q.text||'(खाली)')+'</b><div style="font-size:12px;color:#666;margin-top:4px">'+esc(q.cls||'')+' • '+esc(q.subject||'')+' • '+esc(q.type||'Short')+' • '+(q.marks||1)+' marks</div><div class="actions" style="margin-top:6px"><button onclick="addFromBank(\''+q.id+'\')">➕ Paper में जोड़ें</button><button class="danger" onclick="deleteFromBank(\''+q.id+'\')">Delete</button></div></div>').join(''):'<p style="font-size:13px;color:#666">Question Bank अभी खाली है।</p>'}
window.addFromBank=id=>{const q=questionBank.find(x=>x.id===id);if(!q)return;const copy=JSON.parse(JSON.stringify(q));delete copy.id;delete copy.cls;delete copy.subject;delete copy.savedAt;questions.push(copy);render()};window.deleteFromBank=id=>{if(!confirm('इस question को Question Bank से हटाएँ?'))return;questionBank=questionBank.filter(x=>x.id!==id);localStorage.setItem('spm_question_bank',JSON.stringify(questionBank));renderBank()};
function renderSaved(){const r=$('savedList');if(!r)return;r.innerHTML=saved.length?saved.map((x,i)=>'<div style="border-top:1px solid #ddd;padding:8px 0"><b>'+esc(x.name)+'</b> <small>'+new Date(x.when).toLocaleString()+'</small><div class="actions" style="margin-top:5px"><button onclick="loadSaved('+i+')">Open</button><button class="danger" onclick="deleteSaved('+i+')">Delete</button></div></div>').join(''):'<p style="font-size:13px;color:#666">अभी कोई saved paper नहीं है।</p>'}window.loadSaved=i=>{let s=saved[i]?.data;if(!s)return;Object.keys(s).filter(k=>k!=='questions').forEach(k=>{if($(k))$(k).value=s[k]});questions=s.questions||[];render()};window.deleteSaved=i=>{saved.splice(i,1);localStorage.setItem('spm_saved',JSON.stringify(saved));renderSaved()};function render(){renderQuestions();renderPreview();renderSaved();renderBank()}
$('add').onclick=()=>{questions.push({text:'',type:'Short',marks:1,options:[]});render();setTimeout(()=>document.querySelectorAll('.qt').at(-1)?.focus(),0)};$('saveBank').onclick=()=>saveQuestionBank(questions[questions.length-1]);$('openBank').onclick=()=>{$('bankPanel').style.display=$('bankPanel').style.display==='none'?'block':'none';renderBank()};$('bankSearch').oninput=renderBank;$('bankFilter').oninput=renderBank;$('save').onclick=()=>{saved.push({name:(val('cls')||'Class')+' - '+(val('subject')||'Paper')+' - '+(val('exam')||'Test'),when:new Date().toISOString(),data:state()});localStorage.setItem('spm_saved',JSON.stringify(saved));renderSaved();alert('Paper save हो गया।')};$('clear').onclick=()=>{if(confirm('नया paper शुरू करें? Current unsaved changes हटेंगे.')){questions=[];render()}};$('hindiTip').onclick=()=>{if(!document.querySelector('.qt'))$('add').click();setTimeout(()=>document.querySelectorAll('.qt').at(-1)?.focus(),50);alert('अब Hindi keyboard या keyboard mic से सीधे हिंदी में लिख सकते हैं।')};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({papers:saved,current:state()})],{type:'application/json'}));a.download='SchoolPaperMaker_Backup.json';a.click()};$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);saved=x.papers||[];localStorage.setItem('spm_saved',JSON.stringify(saved));if(x.current){let s=x.current;Object.keys(s).filter(k=>k!=='questions').forEach(k=>{if($(k))$(k).value=s[k]});questions=s.questions||[]}render();alert('Backup restore हो गया।')}catch{alert('Backup गलत है।')}};r.readAsText(f)};
$('previewPrint').onclick=()=>{document.title=(val('school')||'School')+' - '+(val('subject')||'Question Paper');window.print()};
$('previewPdf').onclick=async()=>{const btn=$('previewPdf'),old=btn.textContent;btn.disabled=true;btn.textContent='⏳ PDF बन रहा है...';let blobUrl='';try{if(typeof html2pdf!=='function')throw new Error('html2pdf not loaded');const el=$('preview');if(!el||!el.innerHTML.trim())throw new Error('preview is empty');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const images=[...el.querySelectorAll('img')];await Promise.all(images.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r})));fitQuestionText();await new Promise(r=>requestAnimationFrame(r));const name=((val('school')||'School')+' - '+(val('subject')||'Question Paper')).replace(/[\\/:*?"<>|]/g,'_');const four=val('layout')==='four';const half=val('layout')==='half';const opt={margin:0,filename:name+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#fff',scrollX:0,scrollY:0,windowWidth:Math.max(794,el.scrollWidth||document.documentElement.scrollWidth)},jsPDF:{unit:'mm',format:(val('paperSize')||'A4').toLowerCase(),orientation:(four||half)?'portrait':(val('orientation')||'portrait')},pagebreak:{mode:['css'],before:[],after:[],avoid:['.pq']}};const pdf=await html2pdf().set(opt).from(el).toPdf().get('pdf');const blob=pdf.output('blob');if(!blob||blob.size<1024)throw new Error('empty PDF blob');blobUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=blobUrl;a.download=name+'.pdf';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{if(blobUrl)URL.revokeObjectURL(blobUrl)},60000)}catch(e){console.error(e);if(blobUrl)URL.revokeObjectURL(blobUrl);alert('PDF नहीं बन पाया। पहले page refresh करें और फिर Download PDF दबाएँ।')}finally{btn.disabled=false;btn.textContent=old}};
$('printSettings').onclick=()=>{$('printPanel').style.display=$('printPanel').style.display==='none'?'block':'none'};$('paperSize').onchange=e=>document.documentElement.style.setProperty('--print-size',e.target.value);$('orientation').onchange=e=>document.documentElement.style.setProperty('--print-orientation',e.target.value);$('margins').onchange=e=>document.documentElement.style.setProperty('--print-margin',e.target.value==='none'?'0':e.target.value==='small'?'5mm':'10mm');$('bgPrint').onchange=e=>document.body.classList.toggle('no-bg-print',e.target.value==='no');$('layout').onchange=renderPreview;let activeVoice=null,voiceBase='',voiceTargetIndex=-1;
$('voice').onclick=async()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const resetVoiceButton=()=>{$('voice').disabled=false;$('voice').textContent='🎤 Voice Question'};
  if(!SR){
    let target=document.activeElement&&document.activeElement.classList.contains('qt')?document.activeElement:null;
    if(!target){
      if(!questions.length){questions.push({text:'',type:'Short',marks:1,options:[]});render()}
      target=document.querySelectorAll('.qt').at(-1);
    }
    target?.focus();
    alert('इस PWA में browser Voice Recognition उपलब्ध नहीं है। प्रश्न box में cursor रखें और Windows में Win + H दबाकर बोलें।');
    return;
  }
  if(!window.isSecureContext||location.protocol!=='https:'){
    alert('Voice Question के लिए PWA को Chrome/Edge में HTTPS GitHub Pages से खोलें।');
    return;
  }
  if(activeVoice){try{activeVoice.stop()}catch(e){}return}
  let target=document.activeElement&&document.activeElement.classList.contains('qt')?document.activeElement:null;
  if(!target){
    if(!questions.length){questions.push({text:'',type:'Short',marks:1,options:[]});render()}
    target=document.querySelectorAll('.qt').at(-1);
  }
  voiceTargetIndex=[...document.querySelectorAll('.qt')].indexOf(target);

  r.continuous=false;

  $('voice').disabled=true;

    let finalText='',interimText='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;

    }
    const combined=(finalText||interimText).trim();
    if(!combined)return;
    const base=voiceBase;
    questions[voiceTargetIndex].text=base+(base&&combined?' ':'')+combined;
    renderPreview();
    if(finalText){
      voiceBase=questions[voiceTargetIndex].text;
      renderQuestions();
      setTimeout(()=>{
        const qs=document.querySelectorAll('.qt');
        const q=qs[voiceTargetIndex];
        if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
      },0);
    }
  };
  r.onerror=e=>{
    const msg=e.error==='not-allowed'
      ?'Microphone permission blocked है। Chrome/Edge में 🔒 → Site settings → Microphone → Allow करें।'
      :e.error==='no-speech'
      ?'आवाज़ नहीं मिली। Mic के पास साफ बोलकर फिर दबाएँ।'
      :e.error==='network'
      ?'Voice service/network error है। Internet ON करके फिर दबाएँ।'
      :'Voice error: '+e.error;
    alert(msg);
  };
  r.onend=()=>{
    activeVoice=null;
    resetVoiceButton();
    const qs=document.querySelectorAll('.qt');
    const q=qs[voiceTargetIndex];
    if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  };
  try{r.start()}catch(e){activeVoice=null;resetVoiceButton();alert('Voice start नहीं हो पाया। PWA को Chrome/Edge में खोलकर Microphone Allow करें।')}
};
['school','exam','cls','subject','date','time','total','wm'].forEach(id=>$(id).oninput=renderPreview);let promptEvent=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').style.display='inline-block'});$('install').onclick=async()=>{if(promptEvent){promptEvent.prompt();promptEvent=null}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
