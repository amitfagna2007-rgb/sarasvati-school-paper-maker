<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarasvati School Paper Maker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#173f67">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef2f6;color:#17202a}
.wrap{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d5dbe2;border-radius:12px;padding:14px;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:18px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
label{font-weight:700;font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #aeb7c2;border-radius:8px;font-size:16px}textarea{min-height:70px;resize:vertical}
button{padding:10px 13px;border:1px solid #9ca8b5;border-radius:8px;background:#fff;min-height:42px}.primary{background:#173f67;color:#fff}.danger{color:#a00}.actions{display:flex;gap:8px;flex-wrap:wrap}
.q{border:1px solid #d7dce2;border-radius:10px;padding:12px;margin-top:10px}.opts{margin-top:8px;padding:10px;border:1px dashed #bbb;border-radius:8px}
.paper{background:#fff;color:#111;border:1px solid #999;padding:18mm;margin:0;position:relative;overflow:hidden}.head{text-align:center;border-bottom:1px solid #222;padding-bottom:8px}.logo{width:65px;height:65px;display:block;margin:auto;object-fit:contain}.school{font-weight:800;font-size:20px}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:9px 0;font-size:13px}.section{font-weight:800;border-bottom:1px solid #222;padding-bottom:3px;margin-top:14px}.pq{margin:9px 0;break-inside:avoid}.pq img{max-width:100%;max-height:220px;display:block;margin:7px auto}.page-label{position:absolute;top:2mm;right:3mm;font-size:9px;font-weight:700;z-index:2}.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;opacity:.05;transform:rotate(-25deg);pointer-events:none}
.sheet4{display:grid;grid-template-columns:1fr 1fr;gap:0}.sheet4 .paper{border:1px solid #777;padding:7mm;font-size:9px;min-height:0}.sheet4 .logo{width:35px;height:35px}.sheet4 .school{font-size:12px}.sheet4 .meta{font-size:8px;margin:4px 0}.sheet4 .section{margin-top:6px}.sheet4 .pq{margin:4px 0}.sheet4 .wm{font-size:22px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.paper{padding:8mm}.school{font-size:16px}}
@media print{body{background:#fff}@page{size:A4 portrait;margin:10mm}.noprint{display:none!important}.wrap{max-width:none;padding:0}.card.preview{border:0;padding:0;margin:0}.paper{border:0;margin:0;padding:14mm}.sheet4{page-break-after:always}.sheet4 .paper{padding:6mm}}
<style>@media print{@page{size:var(--print-size, A4) var(--print-orientation, portrait);margin:var(--print-margin,10mm)}body.no-bg-print *{background:transparent!important}}</style></style></head><body>
<header class="noprint" style="background:#173f67;color:#fff;padding:12px"><div class="wrap"><h1>📚 Sarasvati School Paper Maker</h1></div></header>
<main class="wrap">
<section class="card noprint"><h2>Paper Details</h2><div class="grid">
<label>School Name<input id="school" value="SARASVATI BAL VIDHYA MANDIR SAKARGHATA"></label>
<label>Exam Name<input id="exam" value="Unit Test"></label><label>Class<input id="cls" placeholder="Class 10"></label><label>Subject<input id="subject" placeholder="Science"></label>
<label>Date<input id="date" type="date"></label><label>Time<input id="time" value="2 Hours"></label><label>Total Marks<input id="total" type="number" value="50"></label><label>Watermark<input id="wm" value="SARASVATI SCHOOL"></label>
</div></section>
<section class="card noprint"><h2>Questions</h2><div class="actions">
<button class="primary" id="add">＋ Add Question</button><button id="voice">🎤 Voice Question</button><select id="voiceLang" style="width:auto"><option value="hi-IN">हिंदी</option><option value="en-IN">English</option></select>
<button id="save">💾 Save Paper</button><button id="backup">📦 Backup</button><button id="restoreBtn">📥 Restore</button><input id="restore" type="file" accept=".json" hidden>

<button id="install" style="display:none">📲 Install App</button></div><div id="qs"></div></section>
<section class="card noprint" id="printPanel" style="display:none"><h2>🖨️ Print Settings</h2><div class="grid"><label>Paper Size<select id="paperSize"><option>A4</option><option>Letter</option></select></label><label>Orientation<select id="orientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label><label>Margins<select id="margins"><option value="default">Normal</option><option value="small">Small</option><option value="none">None</option></select></label><label>Print Background<select id="bgPrint"><option value="yes">Yes</option><option value="no">No</option></select></label></div><p style="font-size:13px;color:#555;margin:8px 0">PDF के लिए Print दबाकर printer में <b>Save as PDF</b> चुनें। 4-copy mode में एक A4 sheet पर वही paper 4 बार आएगा।</p></section><section class="card preview"><h2 class="noprint">Paper Preview</h2><div class="actions noprint" style="margin:0 0 12px"><button class="primary" id="previewPrint">🖨️ Print</button><button id="previewPdf">📄 Save as PDF</button><button id="printSettings">⚙️ Print Settings</button><select id="layout" style="width:auto"><option value="one">1 Copy</option><option value="four">1/4 Page — 4 Copies</option></select></div><div id="preview"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let questions=[],saved=JSON.parse(localStorage.getItem('spm_saved')||'[]');
function val(id){return $(id).value}
function state(){return{school:val('school'),exam:val('exam'),cls:val('cls'),subject:val('subject'),date:val('date'),time:val('time'),total:val('total'),wm:val('wm'),questions}}
function renderQuestions(){const root=$('qs');root.innerHTML='';questions.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=
'<div><b>Q'+(i+1)+'.</b><textarea class="qt" dir="auto" placeholder="प्रश्न हिंदी या English में लिखें...">'+esc(q.text)+'</textarea></div>'+
'<div class="grid"><label>Type<select class="type"><option '+(q.type==='Short'?'selected':'')+'>Short</option><option '+(q.type==='MCQ'?'selected':'')+'>MCQ</option><option '+(q.type==='Fill'?'selected':'')+'>Fill</option><option '+(q.type==='Long'?'selected':'')+'>Long</option></select></label><label>Marks<input class="mk" type="number" value="'+(q.marks||1)+'"></label></div>'+
(q.type==='MCQ'?'<div class="opts"><b>MCQ Options</b><div class="grid">'+[0,1,2,3].map(j=>'<label>('+String.fromCharCode(65+j)+')<input class="op" data-i="'+j+'" value="'+esc((q.options||[])[j]||'')+'"></label>').join('')+'</div></div>':'')+
'<label>Question Image<input class="img" type="file" accept="image/*"></label><div class="actions" style="margin-top:8px"><button class="up">↑</button><button class="down">↓</button><button class="dup">Duplicate</button><button class="del danger">Delete</button></div>';
d.querySelector('.qt').oninput=e=>{q.text=e.target.value;renderPreview()};d.querySelector('.mk').oninput=e=>{q.marks=Number(e.target.value)||0;renderPreview()};
d.querySelector('.type').onchange=e=>{q.type=e.target.value;q.options=q.options||[];renderQuestions();renderPreview()};
d.querySelectorAll('.op').forEach(x=>x.oninput=e=>{q.options=q.options||[];q.options[Number(e.target.dataset.i)]=e.target.value;renderPreview()});
d.querySelector('.img').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{q.image=ev.target.result;renderPreview()};r.readAsDataURL(f)};
d.querySelector('.del').onclick=()=>{questions.splice(i,1);render()};d.querySelector('.up').onclick=()=>{if(i){[questions[i-1],questions[i]]=[questions[i],questions[i-1]];render()}};d.querySelector('.down').onclick=()=>{if(i<questions.length-1){[questions[i],questions[i+1]]=[questions[i+1],questions[i]];render()}};d.querySelector('.dup').onclick=()=>{questions.splice(i+1,0,JSON.parse(JSON.stringify(q)));render()};root.appendChild(d)})}
function onePaper(pageLabel='Page 1'){let s=state(),h='<div class="paper"><div class="page-label">'+pageLabel+'</div><div class="wm">'+esc(s.wm)+'</div><div class="head"><img class="logo" src="school_logo.svg"><div class="school">'+esc(s.school)+'</div><div>'+esc(s.exam)+' — Question Paper</div></div><div class="meta"><span>Class: <b>'+esc(s.cls)+'</b></span><span>Subject: <b>'+esc(s.subject)+'</b></span><span>Time: <b>'+esc(s.time)+'</b></span><span>Max Marks: <b>'+esc(s.total)+'</b></span></div><div class="meta"><span>Name: __________________</span><span>Roll No.: ______</span><span>Date: '+esc(s.date)+'</span></div>';
let last='';s.questions.forEach((q,i)=>{let sec=q.type==='MCQ'?'Section A — MCQ':q.type==='Fill'?'Section B — Fill in the Blanks':q.type==='Long'?'Section C — Long Answer':'Section D — Short Answer';if(sec!==last){h+='<div class="section">'+sec+'</div>';last=sec}h+='<div class="pq"><b>Q'+(i+1)+'.</b> '+esc(q.text)+' <span style="float:right">['+(q.marks||1)+']</span>'+(q.image?'<img src="'+q.image+'">':'');if(q.type==='MCQ')h+='<div>'+((q.options||[]).map((x,j)=>'('+String.fromCharCode(97+j)+') '+esc(x)).join(' &nbsp; '))+'</div>';h+='</div>'});return h+'</div>'}
function renderPreview(){let n=$('layout').value==='four';$('preview').innerHTML=n?'<div class="sheet4">'+onePaper('Page 1/4')+onePaper('Page 1/4')+onePaper('Page 1/4')+onePaper('Page 1/4')+'</div>':onePaper('Page 1')}
function render(){renderQuestions();renderPreview()}
$('add').onclick=()=>{questions.push({text:'',type:'Short',marks:1,options:[]});render();setTimeout(()=>document.querySelectorAll('.qt').at(-1)?.focus(),0)};
$('save').onclick=()=>{saved.push({name:(val('cls')||'Class')+' - '+(val('subject')||'Paper'),when:new Date().toISOString(),data:state()});localStorage.setItem('spm_saved',JSON.stringify(saved));alert('Paper save हो गया।')};
$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({papers:saved,current:state()})],{type:'application/json'}));a.download='SchoolPaperMaker_Backup.json';a.click()};
$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);saved=x.papers||[];localStorage.setItem('spm_saved',JSON.stringify(saved));if(x.current){let s=x.current;Object.keys(s).filter(k=>k!=='questions').forEach(k=>{if($(k))$(k).value=s[k]});questions=s.questions||[]}render();alert('Backup restore हो गया।')}catch{alert('Backup गलत है।')}};r.readAsText(f)};
$('previewPrint').onclick=()=>window.print();$('previewPdf').onclick=()=>{document.title=(val('school')||'School')+' - '+(val('subject')||'Question Paper');window.print()};$('printSettings').onclick=()=>{$('printPanel').style.display=$('printPanel').style.display==='none'?'block':'none'};$('paperSize').onchange=e=>document.documentElement.style.setProperty('--print-size',e.target.value);$('orientation').onchange=e=>document.documentElement.style.setProperty('--print-orientation',e.target.value);$('margins').onchange=e=>{document.documentElement.style.setProperty('--print-margin',e.target.value==='none'?'0':e.target.value==='small'?'5mm':'10mm')};$('bgPrint').onchange=e=>document.body.classList.toggle('no-bg-print',e.target.value==='no');$('layout').onchange=renderPreview;
$('voice').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('इस browser में voice recognition उपलब्ध नहीं है।');let r=new SR();r.lang=$('voiceLang').value;r.onresult=e=>{questions.push({text:e.results[0][0].transcript,type:'Short',marks:1,options:[]});render()};r.start()};
['school','exam','cls','subject','date','time','total','wm'].forEach(id=>$(id).oninput=renderPreview);
let promptEvent=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').style.display='inline-block'});$('install').onclick=async()=>{if(promptEvent){promptEvent.prompt();promptEvent=null}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
